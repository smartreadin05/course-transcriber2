name: Inspect Mail Cloud Public Folder

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect public folder
        run: |
          python3 - <<'PY'
          import re
          import requests
          from html import unescape

          url = "https://cloud.mail.ru/public/x544/z3kHECF7M"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "ru-RU,ru;q=0.9,en;q=0.8",
          }

          r = requests.get(
              url,
              headers=headers,
              timeout=60,
              allow_redirects=True
          )

          text = r.text

          print("HTTP:", r.status_code)
          print("Final URL:", r.url)
          print("Content-Type:", r.headers.get("content-type"))
          print("Response size:", len(r.content))
          print()

          # Title
          m = re.search(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)
          if m:
              print("TITLE:")
              print(unescape(re.sub(r"<[^>]+>", "", m.group(1))).strip())
              print()

          # Text around likely error messages
          for pattern in [
              "ErrorPage__title",
              "ErrorPage__annotation",
              "ErrorPage__annotationSecondary",
              "Ошибка",
              "Недоступ",
              "не найден",
              "удал",
              "публич"
          ]:
              m = re.search(
                  rf".{{0,300}}{re.escape(pattern)}.{{0,500}}",
                  text,
                  re.I | re.S
              )
              if m:
                  print("MATCH:", pattern)
                  print(unescape(m.group(0)))
                  print("-" * 80)

          # Look for embedded JSON / API data
          print()
          print("Possible Mail Cloud API markers:")

          markers = [
              "weblink_get",
              "weblink",
              "weblink_meta",
              "dispatch",
              "api",
              "dataset",
              "items",
              "folder",
              "resource"
          ]

          for marker in markers:
              print(f"{marker}: {marker.lower() in text.lower()}")
          PY
